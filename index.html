<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>주소가 바뀌었습니다 — 교수학습 및 평가 운영 계획 작성 도우미</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; background: #f3f4f6; color: #1f2937;
      font-family: 'Noto Sans KR', -apple-system, sans-serif; line-height: 1.7;
    }
    .card {
      background: #fff; border: 1px solid #e5e7eb; border-radius: 16px;
      max-width: 560px; width: 100%; padding: 36px 32px;
      box-shadow: 0 4px 16px rgba(0,0,0,.06); text-align: center;
    }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { margin: 0 0 20px; color: #4b5563; font-size: 14px; }
    .go {
      display: inline-block; background: #4f46e5; color: #fff; text-decoration: none;
      font-weight: 700; padding: 13px 26px; border-radius: 10px; font-size: 15px;
    }
    .go:hover { background: #4338ca; }
    .url { font-size: 13px; color: #6b7280; margin-top: 14px; word-break: break-all; }
    .note {
      margin-top: 26px; padding-top: 18px; border-top: 1px solid #f3f4f6;
      font-size: 12px; color: #6b7280;
    }
    .note a { color: #4f46e5; }
    .count { font-weight: 700; color: #4f46e5; }
  </style>
</head>
<body>
  <div class="card">
    <h1>주소가 바뀌었습니다</h1>
    <p>
      교수학습 및 평가 운영 계획 작성 도우미는 새 주소로 옮겼습니다.<br />
      <span class="count" id="sec">5</span>초 뒤 자동으로 이동합니다.
    </p>

    <a class="go" id="go" href="https://teacherplanai.vercel.app/">새 주소로 이동하기</a>
    <div class="url">https://teacherplanai.vercel.app/</div>

    <div class="note">
      이 주소에 <strong>임시 저장해 둔 작성 내용</strong>이 있다면
      <a href="./classic.html">이전 버전</a>에서 이어서 확인하고
      <strong>[저장]</strong>으로 파일을 내려받으세요.<br />
      임시 저장은 주소마다 따로 보관되어 새 주소에서는 보이지 않습니다.
    </div>
  </div>

  <script>
    var target = document.getElementById('go').href;
    var left = 5;
    var el = document.getElementById('sec');
    var timer = setInterval(function () {
      left -= 1;
      el.textContent = String(left);
      if (left <= 0) {
        clearInterval(timer);
        location.replace(target);
      }
    }, 1000);
    // 이전 버전 링크를 누르면 자동 이동을 멈춘다
    document.querySelector('.note a').addEventListener('click', function () {
      clearInterval(timer);
    });
  </script>
</body>
</html>
